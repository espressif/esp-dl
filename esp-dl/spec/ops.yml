# Legal op_type strings (EDL ops[] / Node.op_type) and CMake L1 sources.
# Paths are relative to the esp-dl component root. YAML lives in spec/.
#
# Membership, not a version number: an EDL op is valid iff it is a key here
# or listed under that key's `aliases`. Unknown ops fail configure / deserialize.
# Rename an op_type by adding aliases: [OldName] on the new key; keep the
# ModuleCreator registration for the old string until models are re-exported.
#
# `groups` / per-op `use` / `srcs` / `target` are CMake-only.
# Macro-only .S files are pulled in by #include from real kernel .S files.
# dl/base/dl_kernel.cpp is always compiled from compile_finalize.cmake.

groups:
  lut:
    srcs:
      - dl/base/dl_base_lut.cpp
    target:
      pie_v2:
        - dl/base/isa/esp32p4/dl_esp32p4_lut.S
      pie_v1:
        - dl/base/isa/tie728/dl_tie728_lut.S
  elemwise:
    srcs:
      - dl/base/dl_base_elemwise.cpp
      - dl/base/dl_base_shape.cpp
  conv:
    srcs:
      - dl/base/dl_base_conv_loop.cpp
      - dl/base/dl_base_dwconv_loop.cpp
      - dl/base/dl_base_conv_select.cpp
    target:
      pie_v2:
        - dl/base/isa/esp32p4/dl_esp32p4_s16_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s16_unaligned_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s8_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s8_unaligned_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_w8a16_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_w8a16_unaligned_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s16_depthwise_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s16_unaligned_depthwise_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s8_depthwise_conv2d.S
        - dl/base/isa/esp32p4/dl_esp32p4_s8_unaligned_depthwise_conv2d.S
      pie_v1:
        - dl/base/isa/tie728/dl_tie728_s16_conv2d.S
        - dl/base/isa/tie728/dl_tie728_s16_unaligned_conv2d.S
        - dl/base/isa/tie728/dl_tie728_s8_conv2d.S
        - dl/base/isa/tie728/dl_tie728_w8a16_conv2d.S
        - dl/base/isa/tie728/dl_tie728_w8a16_unaligned_conv2d.S
        - dl/base/isa/tie728/dl_tie728_s16_depthwise_conv2d_block.S
        - dl/base/isa/tie728/dl_tie728_s8_depthwise_conv2d.S
        - dl/base/isa/tie728/dl_tie728_s16_unaligned_depthwise_conv2d.S
      c:
        - dl/base/isa/c/dl_c_conv.cpp
        - dl/base/isa/c/dl_c_dwconv.cpp
        - dl/base/isa/c/dl_c_conv_tail.cpp
        - dl/base/isa/riscv/dl_riscv_conv2d_mac.S
        - dl/base/isa/xtensa/dl_xtensa_conv.cpp
        - dl/base/isa/xtensa/dl_xtensa_s16_conv2d_1x1.S
        - dl/base/isa/xtensa/dl_xtensa_s16_depthwise_conv2d.S

