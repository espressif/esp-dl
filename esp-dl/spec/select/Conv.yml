# Conv / depthwise / Gemm-1x1 slot selection. Op name is this file's stem.
#
# Per-target slots:
#   pie_v1 / pie_v2: [body, border]  (SIMD; kshape 11 omits border)
#   c:               [body, border, tail]
# 1x1 may omit border; 33/hw must provide it. Empty border is nullptr at runtime.
# An EDL is exported for one target. No SIMD→C fallback (old or new models).
# c_align is PIE-only: Cin/Cout multiple of the vector lane count. C rules omit it.
# Pointers are assumed 16-byte aligned. c_align is PIE-only channel width
# (Cin/Cout multiple of the vector lane count); C rules omit it.
# group: 1=Conv/Gemm, dw=depthwise (Conv with group==Cin).

slots:
  pie_v2:
    - body
    - border
  pie_v1:
    - body
    - border
  c:
    - body
    - border
    - tail
rules:
