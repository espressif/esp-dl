    dtype: s16
    group: "1"
    kshape: "11"
    bias: false
    act: linear
    per_ch: false
    c_align: true
    body: dl_esp32p4_s16_conv2d_11cn
  - target: pie_v1
    dtype: s16
    group: "1"
    kshape: "11"
