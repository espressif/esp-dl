.gen_test_cases_template:
  stage: gen_test_cases
  retry:
    max: 1
  image: ${IMAGE}
  tags: ["build", "amd64"]
  dependencies: []
  timeout: 3 hour
  variables:
    ESP_PPQ_VERSION: "1.3.11"
  artifacts:
    when: always
    paths:
      - "**/models/**/*.espdl"
    expire_in: 1 week
  script:
    - pip install --upgrade pip
    - pip install toml
    - pip install ${TORCH} --index-url https://download.pytorch.org/whl/cpu
    - pip install esp-ppq==${ESP_PPQ_VERSION}
    - python tools/ops_test/gen_test_cases.py -t ${TARGET} -q ${QUANT_TYPE} -o ${MODEL_PATH}/${TARGET} -c ${CONFIG_FILE} --ops ${OPS}

install_esp_ppq:
  extends:
    - .gen_test_cases_template
    - .rules:gen:ops_test
  parallel:
    matrix:
      - IMAGE: [python:3.8]
        TORCH: ["torch==2.0.0"]
        TARGET: [esp32p4]
      - IMAGE: [python:3.11]
        TORCH: ["torch==2.7.1"]
        TARGET: [esp32s3, c]
  variables:
    MODEL_PATH: test_apps/esp-dl/models
    CONFIG_FILE: tools/ops_test/config/op_cfg.toml
    OPS: Add
    QUANT_TYPE: w8a8

gen_espdl_ops_cases:
  extends:
    - .gen_test_cases_template
    - .rules:gen:ops_test
  parallel:
    matrix:
      - TARGET: [esp32p4, esp32s3, c]
        QUANT_TYPE: [w8a8, w16a16, w8a16]
      - TARGET: [esp32p4]
        QUANT_TYPE: [none]
  variables:
    IMAGE: "python:3.11"
    TORCH: "torch==2.5.0"
    MODEL_PATH: test_apps/esp-dl/models
    CONFIG_FILE: tools/ops_test/config/op_cfg.toml
    OPS: ALL
  script:
    - |
      set -eu
      CASE_MANAGER="tools/ops_test/manage_case_package.py"
      CASE_FINGERPRINT="$(
        python "${CASE_MANAGER}" fingerprint \
          --esp-ppq-version "${ESP_PPQ_VERSION}" \
          --torch-spec "${TORCH}" \
          --generator-options="--ops=${OPS}" \
          "${CONFIG_FILE}" \
          tools/ops_test/gen_test_cases.py \
          tools/ops_test/torch_ops_test.py \
          tools/ops_test/onnx_ops_test.py
      )"
      echo "Operator case package fingerprint: ${CASE_FINGERPRINT}"

      CASE_STATUS="$(
        python "${CASE_MANAGER}" restore \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --fingerprint "${CASE_FINGERPRINT}" \
          --target "${TARGET}" \
          --quant-type "${QUANT_TYPE}" \
          --project-root "${CI_PROJECT_DIR}"
      )"

      if [ "${CASE_STATUS}" = "hit" ]; then
        echo "Reused generated operator cases from GitLab Package Registry."
      elif [ "${CASE_STATUS}" = "miss" ]; then
        python -m pip install --upgrade pip
        python -m pip install toml
        python -m pip install "${TORCH}" --index-url https://download.pytorch.org/whl/cpu
        python -m pip install "esp-ppq==${ESP_PPQ_VERSION}"
        python tools/ops_test/gen_test_cases.py \
          -t "${TARGET}" \
          -q "${QUANT_TYPE}" \
          -o "${MODEL_PATH}/${TARGET}" \
          -c "${CONFIG_FILE}" \
          --ops "${OPS}"
        python "${CASE_MANAGER}" publish \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --fingerprint "${CASE_FINGERPRINT}" \
          --target "${TARGET}" \
          --quant-type "${QUANT_TYPE}" \
          --project-root "${CI_PROJECT_DIR}" \
          --output-root "${MODEL_PATH}" \
          --esp-ppq-version "${ESP_PPQ_VERSION}" \
          --torch-spec "${TORCH}"
      else
        echo "Unexpected package restore status: ${CASE_STATUS}" >&2
        exit 1
      fi
