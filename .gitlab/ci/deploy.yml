variables:
  ESP_DOCS_ENV_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.3:1-1" 

push_to_github:
  stage: deploy
  extends:
    - .rules:deploy:push_to_github
  when: on_success
  image: $CI_DOCKER_REGISTRY/esp32-ci-env
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
    SUBMODULES_TO_FETCH: "none"
  dependencies: []
  before_script:
    - echo "skip default before_script"
  script:
    - git remote remove github &>/dev/null || true
    - git remote add github https://${GITHUB_PUSH_TOKEN}@github.com/espressif/esp-dl.git
    - source ${CI_PROJECT_DIR}/.gitlab/tool/push_to_github.sh

.deploy_docs_template:
  stage: deploy
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - deploy
  needs:
    - build_esp_dl_html
    - build_esp_dl_pdf
  script:
    - source ${CI_PROJECT_DIR}/.gitlab/tool/utils.sh
    - add_doc_server_ssh_keys $DOCS_DEPLOY_PRIVATEKEY $DOCS_DEPLOY_SERVER $DOCS_DEPLOY_SERVER_USER
    - export GIT_VER=$(git describe --always)
    - pip install -r ${CI_PROJECT_DIR}/docs/requirements.txt
    - deploy-docs

deploy_docs_preview:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_preview
  variables:
    TYPE: "preview"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PREVIEW_URL_BASE"


deploy_docs_production:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_production
  variables:
    TYPE: "production"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PROD_URL_BASE"


create_version_tag:
  stage: deploy
  extends:
    - .rules:deploy:create_version_tag
  when: on_success
  image: $CI_DOCKER_REGISTRY/esp32-ci-env
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
  dependencies: []
  before_script:
    - pip install pyyaml -q
  script:
    - VERSION=$(python -c "import yaml; print(yaml.safe_load(open('${CI_PROJECT_DIR}/esp-dl/idf_component.yml'))['version'])")
    - source ${CI_PROJECT_DIR}/.gitlab/tool/create_version_tag.sh

publish_espdl_ops_perf_baseline:
  stage: deploy
  extends:
    - .rules:deploy:perf_baseline
  image: "python:3.11"
  tags:
    - build
    - amd64
  needs:
    # Not optional: if test_espdl_ops is absent the job must not run (and
    # silently pass) without artifacts. Rules match .rules:build:espdl_ops.
    - job: "test_espdl_ops"
      artifacts: true
  variables:
    GIT_DEPTH: 1
    SUBMODULES_TO_FETCH: "none"
  artifacts:
    when: always
    paths:
      - "*_perf_results.json"
    expire_in: 90 days
  script:
    - |
      set -eu
      # Update the <target>_perf_results.json only when the MR carries the
      # `update-perf-baseline` label (or PERF_UPDATE_BASELINE=1), or when no
      # baseline has been published yet (first run). perf_package.py enforces
      # the first-run part itself.
      UPDATE="0"
      if [ "${PERF_UPDATE_BASELINE:-0}" = "1" ]; then
        UPDATE="1"
      fi
      if echo "${CI_MERGE_REQUEST_LABELS:-}" | grep -qiE '(^|,)[[:space:]]*update-perf-baseline([[:space:]]*(,|$))'; then
        UPDATE="1"
      fi
      echo "Update baseline requested: ${UPDATE}"
      echo "Downloaded performance artifacts:"
      find "${CI_PROJECT_DIR}" -name 'perf_results.json' -print || true

      FAILED=0
      for TARGET in esp32 esp32s3 esp32p4; do
        OUTPUT="${TARGET}_perf_results.json"
        if ! python tools/ops_test/benchmark/perf_package.py aggregate \
             --root "${CI_PROJECT_DIR}" \
             --target "${TARGET}" \
             --output "${OUTPUT}"; then
          echo "Failed to aggregate performance results for ${TARGET}." >&2
          FAILED=1
          continue
        fi
        # Every publication is an immutable <target>-<pipeline-id> version, so
        # concurrent MRs never overwrite or delete each other's baselines.
        python tools/ops_test/benchmark/perf_package.py publish \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --target "${TARGET}" \
          --input "${OUTPUT}" \
          --update "${UPDATE}" \
          --pipeline-id "${CI_PIPELINE_ID}" \
          --list-token "${PACKAGE_CLEANUP_TOKEN:-}"
      done
      if [ "${FAILED}" -ne 0 ]; then
        echo "One or more targets had no performance results." >&2
        exit 1
      fi

cleanup_espdl_perf_packages:
  stage: deploy
  extends:
    - .rules:deploy:perf_baseline
  image: "python:3.11"
  tags:
    - build
    - amd64
  needs: []
  variables:
    GIT_DEPTH: 1
    SUBMODULES_TO_FETCH: "none"
    PERF_PACKAGE_VERSIONS_TO_KEEP: "10"
  script:
    - |
      set -eu
      if [ -z "${PACKAGE_CLEANUP_TOKEN:-}" ]; then
        if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
          echo "PACKAGE_CLEANUP_TOKEN is required on protected branches." >&2
          exit 1
        fi
        echo "Skipping perf package cleanup: protected PACKAGE_CLEANUP_TOKEN is unavailable."
        exit 0
      fi
      python tools/ops_test/benchmark/perf_package.py cleanup \
        --api-url "${CI_API_V4_URL}" \
        --project-id "${CI_PROJECT_ID}" \
        --token "${PACKAGE_CLEANUP_TOKEN}" \
        --keep "${PERF_PACKAGE_VERSIONS_TO_KEEP}"