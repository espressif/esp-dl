variables:
  ESP_DOCS_ENV_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.3:1-1" 

push_to_github:
  stage: deploy
  extends:
    - .rules:deploy:push_to_github
  when: on_success
  image: $CI_DOCKER_REGISTRY/esp32-ci-env
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
    SUBMODULES_TO_FETCH: "none"
  dependencies: []
  before_script:
    - echo "skip default before_script"
  script:
    - git remote remove github &>/dev/null || true
    - git remote add github https://${GITHUB_PUSH_TOKEN}@github.com/espressif/esp-dl.git
    - source ${CI_PROJECT_DIR}/.gitlab/tool/push_to_github.sh

.deploy_docs_template:
  stage: deploy
  image: $ESP_DOCS_ENV_IMAGE
  tags:
    - deploy
  needs:
    - build_esp_dl_html
    - build_esp_dl_pdf
  script:
    - source ${CI_PROJECT_DIR}/.gitlab/tool/utils.sh
    - add_doc_server_ssh_keys $DOCS_DEPLOY_PRIVATEKEY $DOCS_DEPLOY_SERVER $DOCS_DEPLOY_SERVER_USER
    - export GIT_VER=$(git describe --always)
    - pip install -r ${CI_PROJECT_DIR}/docs/requirements.txt
    - deploy-docs

deploy_docs_preview:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_preview
  variables:
    TYPE: "preview"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PREVIEW_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PREVIEW_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PREVIEW_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PREVIEW_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PREVIEW_URL_BASE"


deploy_docs_production:
  extends:
    - .deploy_docs_template
    - .rules:deploy:docs_production
  variables:
    TYPE: "production"
    DOCS_BUILD_DIR: "${CI_PROJECT_DIR}/docs/_build/"
    DOCS_DEPLOY_PRIVATEKEY: "$DOCS_PROD_DEPLOY_KEY"
    DOCS_DEPLOY_SERVER: "$DOCS_PROD_SERVER"
    DOCS_DEPLOY_SERVER_USER: "$DOCS_PROD_SERVER_USER"
    DOCS_DEPLOY_PATH: "$DOCS_PROD_PATH"
    DOCS_DEPLOY_URL_BASE: "$DOCS_PROD_URL_BASE"


create_version_tag:
  stage: deploy
  extends:
    - .rules:deploy:create_version_tag
  when: on_success
  image: $CI_DOCKER_REGISTRY/esp32-ci-env
  tags:
    - github_sync
  variables:
    GIT_STRATEGY: clone
  dependencies: []
  before_script:
    - pip install pyyaml -q
  script:
    - VERSION=$(python -c "import yaml; print(yaml.safe_load(open('${CI_PROJECT_DIR}/esp-dl/idf_component.yml'))['version'])")
    - source ${CI_PROJECT_DIR}/.gitlab/tool/create_version_tag.sh

.espdl_ops_perf:
  image: "python:3.11"
  tags:
    - build
    - amd64
  needs:
    # Not optional: if test_espdl_ops is absent the job must not run (and
    # silently pass) without artifacts. Rules match .rules:build:espdl_ops.
    - job: "test_espdl_ops"
      artifacts: true
  variables:
    GIT_DEPTH: 1
    SUBMODULES_TO_FETCH: "none"
    # Waive the gate for operators whose change is intentional, so an
    # optimization MR is not blocked by its own speedup. On a branch this is
    # all it does -- the baseline itself only ever moves on master. Name the
    # operators (PERF_UPDATE_OPS, or one "update-perf-baseline:<Op>" MR label
    # each) so the waiver cannot also hide an unrelated regression from the
    # same pipeline; PERF_UPDATE_BASELINE="1" or the bare
    # "update-perf-baseline" label waives every operator.
    PERF_UPDATE_BASELINE: "0"
    PERF_UPDATE_OPS: ""

check_espdl_ops_perf:
  stage: perf_gate
  extends:
    - .espdl_ops_perf
    - .rules:perf_gate:check
  artifacts:
    when: always
    paths:
      # The aggregated measurements, annotated in place with each case's delta
      # and status. publish consumes these instead of aggregating again.
      - "*_perf_results.json"
      - "*_perf_diff.md"
    expire_in: 90 days
  script:
    - |
      set -eu
      FAILED=0
      for TARGET in esp32 esp32s3 esp32p4; do
        RESULTS="${TARGET}_perf_results.json"
        if ! python tools/ops_test/benchmark/perf_package.py aggregate \
             --root "${CI_PROJECT_DIR}" \
             --target "${TARGET}" \
             --output "${RESULTS}"; then
          echo "Failed to aggregate performance results for ${TARGET}." >&2
          FAILED=1
          continue
        fi
        # Fetched here rather than in the measurement job so that replaying
        # this job after accept_espdl_ops_perf compares against the baseline
        # that was just accepted.
        python tools/ops_test/benchmark/perf_package.py fetch \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --target "${TARGET}" \
          --output "${TARGET}_perf_baseline_before.json" \
          --list-token "${PACKAGE_CLEANUP_TOKEN:-}"
        if ! python tools/ops_test/benchmark/perf_benchmark.py check \
             --target "${TARGET}" \
             --results "${RESULTS}" \
             --baseline "${TARGET}_perf_baseline_before.json" \
             --report "${TARGET}_perf_diff.md"; then
          FAILED=1
        fi
      done
      if [ "${FAILED}" -ne 0 ]; then
        echo "Read the *_perf_diff.md artifacts." >&2
        if [ "${CI_COMMIT_REF_PROTECTED:-false}" = "true" ]; then
          # The reviewed decision of whether these numbers become the new
          # reference, or whether this pipeline stands as a real failure.
          echo "If every flagged change is expected, play accept_espdl_ops_perf" >&2
          echo "and retry this job; it accepts exactly what was flagged here." >&2
          echo "To accept only some of it, set PERF_ACCEPT_OPS on that job's" >&2
          echo "page. Otherwise this is a genuine regression." >&2
        else
          echo "If every flagged change is expected, add one MR label" >&2
          echo "\"update-perf-baseline:<Op>\" per operator and re-run the" >&2
          echo "pipeline; the baseline itself is only ever written on master." >&2
        fi
        exit 1
      fi

accept_espdl_ops_perf:
  stage: perf_gate
  extends:
    - .espdl_ops_perf
    - .rules:perf_gate:accept
  variables:
    # Optional narrowing. Left empty, this job accepts exactly the operators
    # the gate rejects, which is the whole decision in the common case.
    # Narrow it to a comma-separated list (or "*") only when you reviewed some
    # of the flagged operators and want the rest to keep failing. Note that
    # the play button in the pipeline graph starts the job immediately with no
    # prompt; the form for entering variables is on the job's own page.
    PERF_ACCEPT_OPS: ""
  artifacts:
    # Deliberately not "when: always": a job that accepted nothing produces no
    # baseline, and asking for one would only add a confusing upload error on
    # top of the real message.
    paths:
      - "*_perf_baseline.json"
    expire_in: 90 days
  script:
    - |
      set -eu
      # Only reachable by a human pressing play, so reaching here is the
      # reviewed decision that the measured numbers are the new truth. It
      # republishes the baseline for those operators; retrying
      # check_espdl_ops_perf afterwards then compares against it and passes,
      # without spending a board on a re-measurement.
      ACCEPTED=""
      for TARGET in esp32 esp32s3 esp32p4; do
        RESULTS="${TARGET}_perf_results.json"
        if ! python tools/ops_test/benchmark/perf_package.py aggregate \
             --root "${CI_PROJECT_DIR}" \
             --target "${TARGET}" \
             --output "${RESULTS}"; then
          echo "No performance results for ${TARGET}; nothing to accept." >&2
          continue
        fi
        python tools/ops_test/benchmark/perf_package.py fetch \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --target "${TARGET}" \
          --output "${TARGET}_perf_baseline_before.json" \
          --list-token "${PACKAGE_CLEANUP_TOKEN:-}"
        # Re-derived here rather than read from check_espdl_ops_perf, because
        # depending on that job would make this one unplayable in exactly the
        # case it exists for: when the gate failed.
        OPS="${PERF_ACCEPT_OPS}"
        if [ -z "${OPS}" ]; then
          OPS=$(python tools/ops_test/benchmark/perf_benchmark.py failing-ops \
            --target "${TARGET}" \
            --results "${RESULTS}" \
            --baseline "${TARGET}_perf_baseline_before.json" \
            --report "${TARGET}_perf_diff.md")
        fi
        if [ -z "${OPS}" ]; then
          echo "Nothing rejected for ${TARGET}; leaving its baseline alone."
          continue
        fi
        echo "Accepting measured performance for ${TARGET}: ${OPS}"
        ACCEPTED="${ACCEPTED}${ACCEPTED:+; }${TARGET}: ${OPS}"
        python tools/ops_test/benchmark/perf_package.py publish \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --target "${TARGET}" \
          --input "${RESULTS}" \
          --merged-output "${TARGET}_perf_baseline.json" \
          --update-ops "${OPS}" \
          --trigger "accept" \
          --pipeline-id "${CI_PIPELINE_ID}" \
          --list-token "${PACKAGE_CLEANUP_TOKEN:-}"
      done
      if [ -z "${ACCEPTED}" ]; then
        echo "Nothing to accept: the gate rejects no operator on any target."
      else
        echo "Accepted ${ACCEPTED}"
        echo "Retry check_espdl_ops_perf to turn the pipeline green."
      fi

publish_espdl_ops_perf_baseline:
  stage: deploy
  extends:
    - .espdl_ops_perf
    - .rules:perf_gate:write
  needs:
    # The aggregated, gated results. Depending on the gate rather than on the
    # measurement keeps a rejected regression from being published, and lets
    # an accepted one through as soon as the gate is replayed green.
    - job: "check_espdl_ops_perf"
      artifacts: true
  artifacts:
    when: always
    paths:
      - "*_perf_results.json"
      # The baseline actually uploaded: this pipeline's measurements merged
      # into the previous baseline. Kept separately so the artifact still
      # shows what this pipeline measured on its own.
      - "*_perf_baseline.json"
    expire_in: 90 days
  script:
    - |
      set -eu
      # This job only exists on master (.rules:perf_gate:write) and only runs
      # once check_espdl_ops_perf is green, so reaching here already means the
      # numbers were either within range or explicitly accepted. Since schema
      # v3 the baseline is keyed by the board that measured a case and the
      # runners hand out an arbitrary board per job, so it takes several
      # pipelines to cover every board: record whatever this one saw.
      #
      # Replacing an entry that already exists still needs an explicit scope.
      # Resolved by the same code the gate used so the PERF_UPDATE_OPS syntax
      # is defined in one place; normally empty here, because on master the
      # reviewed path is accept_espdl_ops_perf.
      UPDATE_OPS=$(python tools/ops_test/benchmark/perf_benchmark.py update-scope)
      echo "Baseline update scope: ${UPDATE_OPS:-<none>}"
      ADD_UNSEEN="1"

      FAILED=0
      for TARGET in esp32 esp32s3 esp32p4; do
        # Aggregated and gated by check_espdl_ops_perf; inherited as an
        # artifact so a target that produced no measurements is visible here
        # as a missing file rather than being silently skipped.
        INPUT="${TARGET}_perf_results.json"
        if [ ! -f "${INPUT}" ]; then
          echo "No gated performance results for ${TARGET}." >&2
          FAILED=1
          continue
        fi
        # Every publication is an immutable <pipeline-id> version that holds
        # every target's <target>_perf_results.json, so concurrent MRs never
        # overwrite or delete each other's baselines. The upload is this
        # pipeline's results merged into the previous baseline, so per-board
        # entries accumulate instead of replacing each other.
        python tools/ops_test/benchmark/perf_package.py publish \
          --api-url "${CI_API_V4_URL}" \
          --project-id "${CI_PROJECT_ID}" \
          --token "${CI_JOB_TOKEN}" \
          --target "${TARGET}" \
          --input "${INPUT}" \
          --merged-output "${TARGET}_perf_baseline.json" \
          --update-ops "${UPDATE_OPS}" \
          --add-unseen "${ADD_UNSEEN}" \
          --trigger "automatic" \
          --pipeline-id "${CI_PIPELINE_ID}" \
          --list-token "${PACKAGE_CLEANUP_TOKEN:-}"
      done
      if [ "${FAILED}" -ne 0 ]; then
        echo "One or more targets had no performance results." >&2
        exit 1
      fi
