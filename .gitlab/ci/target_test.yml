variables:
  DOCKER_TARGET_TEST_v5_3_ENV_IMAGE: "$CI_DOCKER_REGISTRY/target-test-env-v5.3:1"
  DOCKER_TARGET_TEST_v5_5_ENV_IMAGE: "$CI_DOCKER_REGISTRY/target-test-env-v5.5:2"
  DOCKER_TARGET_TEST_v6_0_ENV_IMAGE: "$CI_DOCKER_REGISTRY/target-test-env-v6.0:2"
  TEST_CASE_CONFIG: "tools/ops_test/config/op_cfg.toml"

.test_template: &test_template
  image: $DOCKER_TARGET_TEST_v5_5_ENV_IMAGE
  stage: target_test
  retry:
    max: 2
  timeout: 4 hour
  variables:
    GIT_DEPTH: 1
    SUBMODULES_TO_FETCH: "none"
  cache:
    # Usually do not need submodule-cache in target_test
    - key: pip-cache
      paths:
        - .cache/pip
      policy: pull

.pytest_template:
  <<: *test_template
  artifacts:
    when: always
    paths:
      - XUNIT_RESULT.xml
      - pytest_embedded_log/
    reports:
      junit: XUNIT_RESULT.xml
    expire_in: 4 days
  variables:
    TEST_TARGET: 'esp32p4'
    TEST_FOLDER: 'test_apps/esp-dl'
    TEST_ENV: 'esp32p4'
  script:
    - pip install -r test_apps/requirements.txt
    - pytest ${TEST_FOLDER} -p no:idf-ci --target ${TEST_TARGET} --env ${TEST_ENV} --junitxml=XUNIT_RESULT.xml

.pytest_ops_template:
  <<: *test_template
  artifacts:
    when: always
    paths:
      - XUNIT_RESULT.xml
      - pytest_embedded_log/
      - perf_baseline.json
      - perf_results.json
      - perf_diff.md
    reports:
      junit: XUNIT_RESULT.xml
    expire_in: 90 days
  variables:
    TEST_TARGET: 'esp32p4'
    TEST_ENV: 'esp32p4'
    TEST_MODEL: 'conv2d'
    TEST_FOLDER: test_apps/esp-dl/pytest_espdl_ops.py
    PERF_BASELINE_FILE: perf_baseline.json
    PERF_RESULTS_FILE: perf_results.json
    PERF_REPORT_FILE: perf_diff.md
    PERF_RELATIVE_THRESHOLD_PCT: "2"
    PERF_ABSOLUTE_FLOOR_US: "2"
    # Set to "1", or add the MR label "update-perf-baseline", to accept a new
    # performance baseline on an intentional optimization MR.
    PERF_UPDATE_BASELINE: "0"
  script:
    - pip install -r test_apps/requirements.txt
    - python test_apps/esp-dl/gen_op_test.py -c ${TEST_CASE_CONFIG} --pytest_file ${TEST_FOLDER} --target ${TEST_TARGET} --env ${TEST_ENV} 
    - |
      PERF_BASELINE_JOB="test_espdl_ops: [${IDF_TARGET}, ${IDF_VERSION}, ${TEST_MODEL}]"
      python tools/ops_test/perf_benchmark.py fetch \
        --api-url "${CI_API_V4_URL}" \
        --project-id "${CI_PROJECT_ID}" \
        --token "${CI_JOB_TOKEN}" \
        --ref "${CI_DEFAULT_BRANCH}" \
        --job "${PERF_BASELINE_JOB}" \
        --output "${PERF_BASELINE_FILE}"
    - python tools/ops_test/perf_benchmark.py init --output ${PERF_RESULTS_FILE}
    - pytest ${TEST_FOLDER} -p no:idf-ci --target ${TEST_TARGET} --env ${TEST_ENV} --model ${TEST_MODEL} --junitxml=XUNIT_RESULT.xml

.pytest_api_template:
  <<: *test_template
  artifacts:
    when: always
    paths:
      - XUNIT_RESULT.xml
      - pytest_embedded_log/
    reports:
      junit: XUNIT_RESULT.xml
    expire_in: 4 days
  variables:
    TEST_TARGET: 'esp32p4'
    TEST_ENV: 'esp32p4'
    TEST_FOLDER: test_apps/esp-dl/pytest_espdl_api.py
  script:
    - pip install -r test_apps/requirements.txt
    - pytest ${TEST_FOLDER} -p no:idf-ci --target ${TEST_TARGET} --env ${TEST_ENV} --junitxml=XUNIT_RESULT.xml

test_espdl_ops:
  extends:
    - .pytest_ops_template
    - .rules:build:espdl_ops
  needs:
    - job: "build_espdl_ops"
      artifacts: true
      optional: true
  parallel:
    matrix:
      - IDF_TARGET: [esp32p4, esp32s3, esp32]
        IDF_VERSION: "5.5"
        TEST_MODEL: ["opset_5_0", "opset_5_1", "opset_5_2", "opset_5_3", "opset_5_4"]
  tags:
    - ${IDF_TARGET}
  image: $DOCKER_TARGET_TEST_v5_5_ENV_IMAGE
  variables:
    TEST_TARGET: ${IDF_TARGET}
    TEST_ENV: ${IDF_TARGET}
    TEST_MODEL: ${TEST_MODEL}
  
test_espdl_api:
  extends:
    - .pytest_api_template
    - .rules:build:espdl_ops
  needs:
    - job: "build_espdl_ops"
      artifacts: true
      optional: true
  parallel:
    matrix:
      - IDF_TARGET: [esp32s3, esp32]
        IDF_VERSION: "5.3"
        TEST_IMAGE: $DOCKER_TARGET_TEST_v5_3_ENV_IMAGE
      - IDF_TARGET: [esp32p4, esp32s3, esp32]
        IDF_VERSION: "5.5"
        TEST_IMAGE: $DOCKER_TARGET_TEST_v5_5_ENV_IMAGE
      - IDF_TARGET: [esp32p4, esp32s3, esp32]
        IDF_VERSION: "6.0"
        TEST_IMAGE: $DOCKER_TARGET_TEST_v6_0_ENV_IMAGE
  tags:
    - ${IDF_TARGET}
  image: $TEST_IMAGE
  variables:
    TEST_TARGET: ${IDF_TARGET}
    TEST_ENV: ${IDF_TARGET}


